name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod sets the minimum (1.25.0, required by patched pgx and x/text).
          # Pinned tool versions below need Go 1.26; Go downloads that toolchain automatically (GOTOOLCHAIN=auto).
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: go test
        run: go test ./...
      - name: golden flagship hash (both architectures)
        run: |
          go test ./internal/sim -run TestGoldenFlagshipHash -count=1
          go run ./cmd/parallel-sim verify --scenario scenarios/black-friday.json --seed 2026 --inputs scenarios/demo-fork-inputs.json --expect "$(cat scenarios/golden/demo-fork.hash)"
      - name: golden demo duel hashes (both architectures)
        run: |
          go test ./internal/app -run TestGoldenDuelHashes -count=1
          go run ./cmd/parallel-sim verify --scenario scenarios/black-friday.json --seed 2026 --inputs scenarios/demo-duel-human.json --expect "$(awk '$1=="human" && $2=="final" {print $3}' scenarios/golden/demo-duel.hashes)"
          go run ./cmd/parallel-sim verify --scenario scenarios/black-friday.json --seed 2026 --inputs scenarios/demo-duel-ai.json --expect "$(awk '$1=="ai" && $2=="final" {print $3}' scenarios/golden/demo-duel.hashes)"

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: eslint
        run: npx eslint .
      - name: vitest
        run: npx vitest --run
      - name: npm audit
        run: npm audit --audit-level=high
