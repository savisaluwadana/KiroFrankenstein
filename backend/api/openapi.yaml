        creditCents:
          type: integer
          format: int64
        balanceCents:
          type: integer
          format: int64
          description: Balance on the account's normal side.
        entryCount:
          type: integer
          minimum: 0
    LedgerFigure:
      type: object
      additionalProperties: false
      required: [figure, sumCents, entryCount, components]
      properties:
        figure:
          $ref: '#/components/schemas/MoneyFigure'
        sumCents:
          type: integer
          format: int64
          description: Sum over components of sign times the account balance, computed from the Ledger entries.
        entryCount:
          type: integer
          minimum: 0
          description: Number of entries with a line on a component account.
        components:
          type: array
          items:
            $ref: '#/components/schemas/LedgerFigureComponent'
    LedgerFigureComponent:
      type: object
      additionalProperties: false
      required: [account, sign]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        sign:
          type: integer
          enum: [-1, 1]
    LedgerEntry:
      type: object
      description: One balanced posting. Total debits equal total credits.
      additionalProperties: false
      required: [index, tick, simMinute, description, cause, lines]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position of the entry in the Branch's full Ledger.
        tick:
          $ref: '#/components/schemas/Tick'
        simMinute:
          $ref: '#/components/schemas/SimMinute'
        description:
          type: string
          description: Human-readable text derived from the cause. Not state.
        cause:
          $ref: '#/components/schemas/CauseRef'
        lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/LedgerLine'
        contributionCents:
          type: integer
          format: int64
          description: Present with the `figure` filter. The entry's signed share of that figure.
    CauseRef:
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          type: string
          enum: [opening, shipment, receipt, freight, labor, marketing, overhead, service_credit]
          description: |
            opening: ref 0. shipment: ref is the order ID. receipt: ref is the
            purchase-order ID. freight: ref is the purchase-order ID. labor,
            marketing, overhead: ref is the Tick. service_credit: ref is the order ID.
        ref:
          type: integer
          format: int64
    LedgerLine:
      type: object
      description: One of `debitCents` and `creditCents` is non-zero.
      additionalProperties: false
      required: [account, debitCents, creditCents]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        debitCents:
          type: integer
          format: int64
          minimum: 0
        creditCents:
          type: integer
          format: int64
          minimum: 0
    JournalResponse:
      type: object
      additionalProperties: false
      required: [branchId, from, to, total, offset, entries, currency, disclaimer]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        from:
          $ref: '#/components/schemas/Tick'
        to:
          $ref: '#/components/schemas/Tick'
        total:
          type: integer
          minimum: 0
          description: Number of outcomes in the range.
        offset:
          type: integer
          minimum: 0
        entries:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
        currency:
          $ref: '#/components/schemas/Currency'
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
        warnings:
          $ref: '#/components/schemas/Warnings'
    JournalEntry:
      type: object
      description: |
        One outcome. `demand` sets potentialArrivals, conversionBps and
        ordersCreated. `order_cancelled` sets orderId, units and ageMinutes.
        `shipment` sets orderId, units and minutesLate (0 when on time).
      additionalProperties: false
      required: [index, tick, simMinute, kind, sku]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position in the journal of the requested range.
        tick:
          $ref: '#/components/schemas/Tick'
        simMinute:
          $ref: '#/components/schemas/SimMinute'
        kind:
          type: string
          enum: [demand, order_cancelled, shipment]
        sku:
          type: integer
          format: int64
          description: Index into the Scenario SKUs.
        potentialArrivals:
          type: integer
          format: int64
        conversionBps:
          $ref: '#/components/schemas/Bps'
        ordersCreated:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        units:
          type: integer
          format: int64
        ageMinutes:
          type: integer
          format: int64
        minutesLate:
          type: integer
          format: int64
    EndOfHorizonResponse:
      type: object
      additionalProperties: false
      required: [branchId, stateHash, statement, currency, disclaimer]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        stateHash:
          $ref: '#/components/schemas/StateHash'
        statement:
          $ref: '#/components/schemas/EndOfHorizon'
        currency:
          $ref: '#/components/schemas/Currency'
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
        warnings:
          $ref: '#/components/schemas/Warnings'
    EndOfHorizon:
      type: object
      additionalProperties: false
      required:
        - tick
        - atHorizon
        - metrics
        - backlogRevenueRecognisedCents
        - backlogServiceCreditCents
        - openPurchaseOrders
        - committedUnits
        - committedCostCents
        - stock
        - stockUnits
        - stockValueCents
        - inventoryMatch
        - accruedUnpaidWagesCents
        - balanceIdentityHolds
      properties:
        tick:
          $ref: '#/components/schemas/Tick'
        atHorizon:
          type: boolean
          description: True when the Tick is the Scenario horizon.
        metrics:
          $ref: '#/components/schemas/Metrics'
        backlogRevenueRecognisedCents:
          $ref: '#/components/schemas/Cents'
          description: Always 0. Open orders have no revenue recorded.
        backlogServiceCreditCents:
          $ref: '#/components/schemas/Cents'
          description: Always 0. Open orders have no service credit recorded.
        openPurchaseOrders:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderCommitment'
        committedUnits:
          type: integer
          format: int64
        committedCostCents:
          $ref: '#/components/schemas/Cents'
        stock:
          type: array
          description: Remaining stock per SKU at moving-average cost, ascending by SKU.
          items:
            $ref: '#/components/schemas/StockLine'
        stockUnits:
          type: integer
          format: int64
        stockValueCents:
          $ref: '#/components/schemas/Cents'
        inventoryMatch:
          type: boolean
          description: True when the stock value equals the Inventory account balance.
        accruedUnpaidWagesCents:
          $ref: '#/components/schemas/Cents'
          description: Always 0. Wages are paid in the Tick earned.
        balanceIdentityHolds:
          type: boolean
          description: True when cash plus inventory equals opening equity plus net profit.
    PurchaseOrderCommitment:
      type: object
      additionalProperties: false
      required: [purchaseOrderId, sku, supplier, qty, unitCostCents, committedCostCents, dueAtTick]
      properties:
        purchaseOrderId:
          type: integer
          format: int64
          minimum: 1
        sku:
          type: integer
          format: int64
        supplier:
          $ref: '#/components/schemas/SupplierRole'
        qty:
          type: integer
          format: int64
        unitCostCents:
          $ref: '#/components/schemas/Cents'
        committedCostCents:
          $ref: '#/components/schemas/Cents'
        dueAtTick:
          $ref: '#/components/schemas/Tick'
          description: The Tick whose step receives the purchase order.
    StockLine:
      type: object
      additionalProperties: false
      required: [sku, onHand, valueCents]
      properties:
        sku:
          type: integer
          format: int64
        onHand:
          type: integer
          format: int64
        valueCents:
          $ref: '#/components/schemas/Cents'
    CreateDuelRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        seed:
          $ref: '#/components/schemas/Seed'
        scenario:
          type: object
          description: A scenario document. Omit it to use the flagship scenario.
          additionalProperties: true
        overrides:
          type: object
          description: Assumption dotted path to new integer value.
          additionalProperties:
            type: integer
            format: int64
        forkTick:
          $ref: '#/components/schemas/Tick'
        aiKind:
          type: string
          enum: [ai_rule_based, ai_llm]
          default: ai_rule_based
    DuelBranch:
      type: object
      additionalProperties: false
      required: [branch, managerLabel]
      properties:
        branch:
          $ref: '#/components/schemas/Branch'
        managerLabel:
          type: string
          description: 'Plain label: "You", "Rule-based AI", "LLM AI (<model>)" or "Rule-based AI (LLM fallback: <reason>)".'
    Duel:
      type: object
      additionalProperties: false
      required: [id, worldId, parentBranchId, aiKind, forkTick, comparisonPolicy, createdAt, human, ai]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        worldId:
          $ref: '#/components/schemas/Uuid'
        parentBranchId:
          $ref: '#/components/schemas/Uuid'
        aiKind:
          $ref: '#/components/schemas/ManagerKind'
        forkTick:
          $ref: '#/components/schemas/Tick'
        comparisonPolicy:
          type: string
          description: How the Comparison_Tick is chosen. `min_head_tick` is the lower head Tick of the two sides.
        createdAt:
          type: string
          format: date-time
        human:
          $ref: '#/components/schemas/DuelBranch'
        ai:
          $ref: '#/components/schemas/DuelBranch'
    DuelStatus:
      type: object
      additionalProperties: false
      required: [duelId, humanHeadTick, aiHeadTick, comparisonTick, horizonTick, finished, windowOpen, windowReasons, waitingOn]
      properties:
        duelId:
          $ref: '#/components/schemas/Uuid'
        humanHeadTick:
          $ref: '#/components/schemas/Tick'
        aiHeadTick:
          $ref: '#/components/schemas/Tick'
        comparisonTick:
          $ref: '#/components/schemas/Tick'
        horizonTick:
          $ref: '#/components/schemas/Tick'
        finished:
          type: boolean
          description: True when both sides are at the horizon.
        windowOpen:
          type: boolean
          description: A Decision_Window is open for the human at its head.
        windowReasons:
          type: array
          items:
            $ref: '#/components/schemas/WindowReason'
        waitingOn:
          type: string
          enum: [human, none]
          description: '`human` while the human window is open and not ended; neither side advances then.'
        warnings:
          $ref: '#/components/schemas/Warnings'
    DuelResponse:
      type: object
      additionalProperties: false
      required: [duel, status]
      properties:
        duel:
          $ref: '#/components/schemas/Duel'
        status:
          $ref: '#/components/schemas/DuelStatus'
    CreateDuelResponse:
      type: object
      additionalProperties: false
      required: [world, duel, status, writeToken]
      properties:
        writeToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: |
            Random 256-bit write token (base64url), shown only in this response.
            The server stores its SHA-256 hash only. Send it as
            `X-Parallel-Write-Token` on every request that changes the world.
            Anyone with only the world id can read but not change it.
        world:
          $ref: '#/components/schemas/World'
        duel:
          $ref: '#/components/schemas/Duel'
        status:
          $ref: '#/components/schemas/DuelStatus'
    AdvanceDuelResult:
      type: object
      additionalProperties: false
      required: [headTick, paused, windowReasons, status, currency, disclaimer]
      properties:
        headTick:
          $ref: '#/components/schemas/Tick'
        paused:
          $ref: '#/components/schemas/PauseReason'
        windowReasons:
          type: array
          items:
            $ref: '#/components/schemas/WindowReason'
        human:
          $ref: '#/components/schemas/AdvanceResult'
        ai:
          $ref: '#/components/schemas/AdvanceResult'
        status:
          $ref: '#/components/schemas/DuelStatus'
        currency:
          $ref: '#/components/schemas/Currency'
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
    DuelInjectResult:
      type: object
      additionalProperties: false
      required: [human, ai]
      properties:
        human:
          $ref: '#/components/schemas/InjectDisruptionResult'
        ai:
          $ref: '#/components/schemas/InjectDisruptionResult'
    DuelScoreComponents:
      type: object
      additionalProperties: false
      required: [financialBps, fulfilmentRateBps, onTimeBps, compositeHundredths]
      properties:
        financialBps:
          $ref: '#/components/schemas/Bps'
        fulfilmentRateBps:
          $ref: '#/components/schemas/Bps'
        onTimeBps:
          $ref: '#/components/schemas/Bps'
        compositeHundredths:
          type: integer
          format: int64
          description: Composite score in hundredths of a point, 0 to 10000.
    DuelWeightedComponents:
      type: object
      additionalProperties: false
      required: [financialHundredths, fulfilmentHundredths, onTimeHundredths]
      description: Each component times its weight, rounded half to even, in hundredths of a point. They can differ from the composite by at most one hundredth.
      properties:
        financialHundredths:
          type: integer
          format: int64
        fulfilmentHundredths:
          type: integer
          format: int64
        onTimeHundredths:
          type: integer
          format: int64
    DuelBranchScore:
      type: object
      additionalProperties: false
      required: [branchId, managerKind, managerLabel, score, weighted, metrics, cancelledOrders]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        managerKind:
          $ref: '#/components/schemas/ManagerKind'
        managerLabel:
          type: string
        score:
          $ref: '#/components/schemas/DuelScoreComponents'
        weighted:
          $ref: '#/components/schemas/DuelWeightedComponents'
        metrics:
          $ref: '#/components/schemas/Metrics'
        cancelledOrders:
          type: integer
          format: int64
    DuelScore:
      type: object
      additionalProperties: false
      required: [duelId, comparisonTick, horizonTick, provisional, outcome, human, ai, weights, profitFloorCents, profitTargetCents, tieToleranceHundredths, currency, disclaimer]
      properties:
        duelId:
          $ref: '#/components/schemas/Uuid'
        comparisonTick:
          $ref: '#/components/schemas/Tick'
        horizonTick:
          $ref: '#/components/schemas/Tick'
        provisional:
          type: boolean
          description: True while either side is below the horizon. The outcome is then a standing, not a declared winner.
        outcome:
          type: string
          enum: [human_wins, ai_wins, draw]
        human:
          $ref: '#/components/schemas/DuelBranchScore'
        ai:
          $ref: '#/components/schemas/DuelBranchScore'
        weights:
          $ref: '#/components/schemas/ScoreWeights'
        profitFloorCents:
          $ref: '#/components/schemas/Cents'
        profitTargetCents:
          $ref: '#/components/schemas/Cents'
        tieToleranceHundredths:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/Currency'
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
        warnings:
          $ref: '#/components/schemas/Warnings'
    DuelDecision:
      type: object
      additionalProperties: false
      required: [managerLabel, windowTick, managerKind, provenance, rationale, proposed, acceptedCount, rejected, createdAt]
      properties:
        managerLabel:
          type: string
          description: 'Plain provenance label, for example "Rule-based AI" or "Rule-based AI (LLM fallback: timeout)".'
        windowTick:
          $ref: '#/components/schemas/Tick'
        managerKind:
          $ref: '#/components/schemas/ManagerKind'
        provenance:
          $ref: '#/components/schemas/Provenance'
        model:
          type: string
          description: Model name of an LLM proposal. Omitted otherwise.
        fallbackReason:
          type: string
          description: Why the rule-based manager stood in, with provenance `ai_rule_based_fallback`. Omitted otherwise.
        rationale:
          type: string
          description: Untrusted display text. Empty when the manager gave none.
        proposed:
          type: array
          description: The Commands the manager proposed, in priority order.
          items:
            $ref: '#/components/schemas/Command'
        acceptedCount:
          type: integer
          minimum: 0
          description: How many proposals the validator accepted and stored as Inputs.
        rejected:
          type: array
          description: Proposals the validator refused. They were stored nowhere.
          items:
            $ref: '#/components/schemas/ValidationResult'
        createdAt:
          type: string
          format: date-time
          description: Server wall-clock time. Metadata, excluded from every State_Hash.
    DuelDecisionsResponse:
      type: object
      additionalProperties: false
      required: [duelId, branchId, decisions]
      properties:
        duelId:
          $ref: '#/components/schemas/Uuid'
        branchId:
          $ref: '#/components/schemas/Uuid'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/DuelDecision'
    CreateDemoRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
    DemoResponse:
      type: object
      additionalProperties: false
      required: [world, rootBranch, plan, writeToken]
      properties:
        writeToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: |
            Random 256-bit write token (base64url), shown only in this response.
            The server stores its SHA-256 hash only. Send it as
            `X-Parallel-Write-Token` on every request that changes the world.
            Anyone with only the world id can read but not change it.
        world:
          $ref: '#/components/schemas/World'
        rootBranch:
          $ref: '#/components/schemas/Branch'
        plan:
          $ref: '#/components/schemas/DemoPlan'
    DemoPlan:
      type: object
      description: |
        Derived from a no-command run of the flagship scenario. It states where to
        fork and what to order. It asserts no financial outcome.
      additionalProperties: false
      required: [scenario, seed, crisisTick, forkTick, commands, reasons]
      properties:
        scenario:
          type: string
        seed:
          $ref: '#/components/schemas/Seed'
        crisisTick:
          $ref: '#/components/schemas/Tick'
          description: Lowest Tick with an active Disruption or a stock-bound order in the no-command run.
        forkTick:
          $ref: '#/components/schemas/Tick'
          description: First scheduled Decision_Window at or after the crisis Tick that can still receive a backup order before the horizon.
        commands:
          type: array
          items:
            $ref: '#/components/schemas/DemoCommand'
        reasons:
          type: array
          description: Plain-language derivation steps.
          items:
            type: string
    DemoCommand:
      type: object
      additionalProperties: false
      required: [kind, skuIndex, skuId, role, qty]
      properties:
        kind:
          $ref: '#/components/schemas/CommandKind'
        skuIndex:
          type: integer
          format: int64
          minimum: 0
        skuId:
          type: string
        role:
          $ref: '#/components/schemas/SupplierRole'
        qty:
          type: integer
          format: int64
          minimum: 1
    ProgressTickEvent:
      description: Data of a `tick` event of the progress stream. A TickFrame plus optional `warnings`.
      allOf:
        - $ref: '#/components/schemas/TickFrame'
        - type: object
          properties:
            warnings:
              $ref: '#/components/schemas/Warnings'
    ProgressDecisionWindowEvent:
      type: object
      description: Data of a `decision_window` event of the progress stream.
      additionalProperties: false
      required: [tick, reasons]
      properties:
        tick:
          $ref: '#/components/schemas/Tick'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/WindowReason'
    ProgressCompletedEvent:
      type: object
      description: Data of the `completed` event of the progress stream, sent once the horizon frame is out.
      additionalProperties: false
      required: [tick, stateHash, currency, disclaimer]
      properties:
        tick:
          $ref: '#/components/schemas/Tick'
        stateHash:
          $ref: '#/components/schemas/StateHash'
        currency:
          $ref: '#/components/schemas/Currency'
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
