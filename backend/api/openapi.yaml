openapi: 3.1.0
info:
  title: Parallel API
  version: 0.1.0
  summary: Slice endpoints of the Parallel simulation API.
  description: |
    Parallel is a deterministic, forkable simulation of one e-commerce
    warehouse business. This document is the source of truth for the HTTP
    contract of the vertical slice. Go handlers and the TypeScript client are
    written against it.

    **Conventions**

    - Every path is served below the server base `/api/v1`.
    - Money is an integer count of minor units (cents). Every response that
      carries money also carries `currency`, an ISO 4217 code (`USD` for the
      flagship scenario). Money fields are named `...Cents`.
    - Rates and percentages are integer basis points (1 % = 100 bps), named
      `...Bps`.
    - Ticks are integer simulated hours. Tick 0 is the initial state.
    - State hashes are lowercase hex SHA-256 strings (64 characters).
    - Request bodies are decoded strictly: unknown fields give 400. Bodies
      over 256 KiB give 413.
    - Errors are `application/problem+json` (RFC 9457) without stack traces.
    - Every response that carries metrics also carries the `disclaimer`
      field. Results are synthetic and are never a forecast.
    - Reading a World, Branch or Duel needs only its identifier (a link is a
      read-only capability). Changing one needs the world's write token in
      the `X-Parallel-Write-Token` header; it is returned once, as
      `writeToken`, when the world, demo or duel is created. There are no
      user accounts (documented limitation). `POST /diffs` only reads and
      needs no token. Starting an LLM-backed manager may need an
      `X-Parallel-LLM-Code` header (see `GET /managers`).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: Same-origin API base.
security: []
tags:
  - name: Meta
    description: Server health.
  - name: Operations
    description: Infrastructure probes for load balancers and orchestrators. Served at the server root, outside `/api/v1`, and exempt from rate limiting.
  - name: Worlds
    description: Create and read Worlds.
  - name: Branches
    description: Branch list, fork and advance.
  - name: Decisions
    description: Commands and Decision_Windows.
  - name: Reads
    description: Rewind reads at any computed Tick. Reads never change a Head_Tick or the Input_Log.
  - name: Demo
    description: The flagship demo path.
  - name: Duels
    description: Human versus AI manager from one fork Tick, advanced in lockstep.
  - name: Managers
    description: The Manager kinds a Branch can have and whether each is available.
paths:
  /managers:
    get:
      operationId: listManagers
      tags: [Managers]
      summary: List Manager kinds and their availability.
      description: |
        Lists human, the rule-based AI and the LLM AI. The rule-based AI is
        always available. The LLM AI is available only when the server has an
        LLM configuration; the response then names the model and never the
        API key or the endpoint.
      responses:
        '200':
          description: The Manager kinds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerList'
        '429':
          $ref: '#/components/responses/RateLimited'
  /health:
    get:
      operationId: getHealth
      tags: [Meta]
      summary: Server health.
      description: Returns 200 while the server can serve requests. Needs no database round trip beyond a store ping.
      responses:
        '200':
          description: The server is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /healthz:
    servers:
      - url: /
        description: Server root (not under /api/v1).
    get:
      operationId: getLiveness
      tags: [Operations]
      summary: Liveness probe.
      description: Returns 200 while the process is running (GET or HEAD). It checks no dependency and is not rate limited.
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeStatus'
        '405':
          description: A method other than GET or HEAD (type `bad-request`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /readyz:
    servers:
      - url: /
        description: Server root (not under /api/v1).
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Readiness probe.
      description: |
        Returns 200 when the server can take traffic: it is not shutting down,
        and with PostgreSQL configured the database answers a ping within 2 s
        and the schema is present (the schema check is cached for 30 s). It
        returns a generic 503 `unavailable` problem otherwise and never says
        why. It is not rate limited.
      responses:
        '200':
          description: The server is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeStatus'
        '405':
          description: A method other than GET or HEAD (type `bad-request`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /worlds:
    post:
      operationId: createWorld
      tags: [Worlds]
      summary: Create a World and its root Branch.
      description: |
        Validates the scenario with the overrides applied, canonicalizes it
        and stores the World. The root Branch is at Head_Tick 0 with its
        Decision_Window open. When `scenario` is omitted the flagship
        scenario "Black Friday Meltdown" is used.
      parameters:
        - $ref: '#/components/parameters/LLMCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorldRequest'
      responses:
        '403':
          $ref: '#/components/responses/LLMAccessCodeRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '201':
          description: The World and its root Branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorldResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
  /worlds/{worldId}:
    get:
      operationId: getWorld
      tags: [Worlds]
      summary: Read a World.
      description: |
        Returns the World with its effective Assumptions (value, unit,
        default, bounds, rationale, overridden flag) and a scenario summary.
        The Disruption_Script is never returned.
      parameters:
        - $ref: '#/components/parameters/WorldId'
      responses:
        '200':
          description: The World.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '404':
          $ref: '#/components/responses/NotFound'
  /worlds/{worldId}/assumptions:
    get:
      operationId: getAssumptions
      tags: [Worlds]
      summary: Read the Assumptions of a World, optionally with the surprises that have already happened.
      description: |
        Returns every effective Assumption (value, unit, default, bounds,
        rationale, overridden flag). The Disruption_Script is hidden unless
        `revealScript=true`. Then the server returns only the entries whose
        onset Tick is at or before the Head_Tick of the Branch (the root
        Branch by default; for a Duel Branch, the lower of the two duel heads),
        and the whole script once that head has reached the horizon. The
        client cannot ask for more. A Branch of another World is refused
        with 403.
      parameters:
        - $ref: '#/components/parameters/WorldId'
        - name: revealScript
          in: query
          required: false
          schema:
            type: boolean
        - name: branchId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The Assumptions and, when asked, the revealed part of the script.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssumptionsResponse'
        '403':
          description: The Branch belongs to another World (type `forbidden`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /worlds/{worldId}/branches:
    get:
      operationId: listBranches
      tags: [Branches]
      summary: List the Branches of a World.
      description: Branches are returned in creation order. The root Branch is first.
      parameters:
        - $ref: '#/components/parameters/WorldId'
      responses:
        '200':
          description: The Branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchList'
        '404':
          $ref: '#/components/responses/NotFound'
  /demo:
    post:
      operationId: createDemo
      tags: [Demo]
      summary: Create the flagship demo World.
      description: |
        Creates a World from the flagship scenario with the demo seed and
        returns it with its root Branch (at Head_Tick 0, not advanced) and
        the derived demo plan. The plan comes from a no-command run of the
        scenario. It names where to fork and which backup purchase order to
        place. It asserts no financial outcome and never lists Disruption_Script
        entries.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDemoRequest'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '201':
          description: The demo World, its root Branch and the plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
  /branches/{branchId}:
    get:
      operationId: getBranch
      tags: [Branches]
      summary: Read a Branch.
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: The Branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404':
          $ref: '#/components/responses/NotFound'
  /branches/{branchId}/fork:
    post:
      operationId: forkBranch
      tags: [Branches]
      summary: Fork a Branch at a computed Tick.
      description: |
        Creates a child Branch whose history is the parent's Input_Log up to
        and including `atTick`. The child's Head_Tick is `atTick` and a fork
        Decision_Window is open there. Commands the parent submitted in its
        own window at `atTick` are not visible to the child. The parent is
        never modified. A World holds at most 32 Branches.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/WriteToken'
        - $ref: '#/components/parameters/LLMCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkRequest'
      responses:
        '401':
          $ref: '#/components/responses/WriteTokenRequired'
        '403':
          $ref: '#/components/responses/WriteTokenInvalid'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '201':
          description: The child Branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /branches/{branchId}/advance:
    post:
      operationId: advanceBranch
      tags: [Branches]
      summary: Advance a Branch.
      description: |
        Without `runToTick` the Branch advances to the next Decision_Window or
        the horizon. With `runToTick` it ends intervening windows without
        Commands and stops at `runToTick`, the horizon, or the next
        Disruption-onset window, whichever comes first. Advancing from an
        open window ends that window. The number of Ticks per request never
        changes any state hash.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/WriteToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceRequest'
      responses:
        '401':
          $ref: '#/components/responses/WriteTokenRequired'
        '403':
          $ref: '#/components/responses/WriteTokenInvalid'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Where the advance stopped and the newly computed Tick_Frames.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /branches/{branchId}/commands:
    post:
      operationId: submitCommands
      tags: [Decisions]
      summary: Submit Commands in the open Decision_Window.
      description: |
        `windowTick` must equal the Head_Tick and a Decision_Window must be
        open there. Each Command passes the deterministic validator in order.
        Accepted Commands become Inputs that take effect at `windowTick + 1`.
        Rejected Commands are returned with a reason code and are stored
        nowhere. A repeated `Idempotency-Key` on the same Branch returns the
        original accepted Inputs with `duplicate: true` and appends nothing.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/WriteToken'
        - name: Idempotency-Key
          in: header
          required: false
          description: Client-chosen key, 1 to 128 printable ASCII characters.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[\x21-\x7E]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCommandsRequest'
      responses:
        '401':
          $ref: '#/components/responses/WriteTokenRequired'
        '403':
          $ref: '#/components/responses/WriteTokenInvalid'
        '200':
          description: Accepted Inputs and rejected Commands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitCommandsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /branches/{branchId}/decision-window/end:
    post:
      operationId: endDecisionWindow
      tags: [Decisions]
      summary: End the open Decision_Window.
      description: |
        Closes the window at the Head_Tick without further Commands. Commands
        already submitted stay recorded. Ending the window does not advance
        the Branch; call `advanceBranch` for that.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/WriteToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndWindowRequest'
      responses:
        '401':
          $ref: '#/components/responses/WriteTokenRequired'
        '403':
          $ref: '#/components/responses/WriteTokenInvalid'
        '204':
          description: The window is closed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /branches/{branchId}/disruptions:
    post:
      operationId: injectDisruption
      tags: [Decisions]
      summary: Inject a Disruption into the Branch's future.
      description: |
        Appends exactly one Input (kind disruption, provenance `injected`)
        that takes effect at `startTick`. `startTick` must be above the
        Head_Tick; otherwise the request fails with `history-immutable`
        (fork to change the past). Values outside the allowed ranges fail with
        `validation`, and the issue names the range. The Disruption is not
        visible in any Observation before its onset Tick, and its onset opens
        a Decision_Window, so advancing pauses there. A repeated
        `Idempotency-Key` on the same Branch returns the original Input with
        `duplicate: true` and appends nothing.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/WriteToken'
        - name: Idempotency-Key
          in: header
          required: false
          description: Client-chosen key, 1 to 128 printable ASCII characters.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[\x21-\x7E]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjectDisruptionRequest'
      responses:
        '401':
          $ref: '#/components/responses/WriteTokenRequired'
        '403':
          $ref: '#/components/responses/WriteTokenInvalid'
        '200':
          description: The recorded Disruption Input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InjectDisruptionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /branches/{branchId}/tick-frames:
    get:
      operationId: listTickFrames
      tags: [Reads]
      summary: Read Tick_Frames for a range of Ticks.
      description: |
        Returns the frames for Ticks `from` through `to` inclusive, ascending.
        A range spans at most 240 Ticks. `to` must not exceed the Head_Tick.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - name: from
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Tick'
        - name: to
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Tick'
      responses:
        '200':
          description: The frames.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickFramesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /branches/{branchId}/state:
    get:
      operationId: getBranchState
      tags: [Reads]
      summary: Read the Observation and State_Hash at a Tick.
      description: |
        A rewind read: it never changes the Head_Tick. The Observation holds
        only what a Manager may know at that Tick. It never contains the seed,
        random stream state or future Disruptions.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/TickQuery'
      responses:
        '200':
          description: The state view at the Tick.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /branches/{branchId}/metrics:
    get:
      operationId: getBranchMetrics
      tags: [Reads]
      summary: Read the Metrics at a Tick.
      description: A rewind read of the Metrics_Calculator output at the Tick.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/TickQuery'
      responses:
        '200':
          description: The metrics at the Tick.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /branches/{branchId}/ledger:
    get:
      operationId: listLedgerEntries
      tags: [Reads]
      summary: Drill down into Ledger entries.
      description: |
        Returns the double-entry Ledger entries posted in Ticks `from` through
        `to` inclusive, in posting order. Every money figure in the metrics is a
        sum of these entries or a documented formula over them. Entries have
        a description derived from their cause and a reference to the cause.
        Results are paged with `limit` and `offset`.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - name: from
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Tick'
        - name: to
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Tick'
        - name: account
          in: query
          required: false
          description: Keep only entries with a line on this account.
          schema:
            $ref: '#/components/schemas/Account'
        - name: figure
          in: query
          required: false
          description: |
            Keep only entries with a line on an account that makes up this
            headline money figure, and return each entry's signed
            `contributionCents` plus the server-computed `sumCents` over every
            matching entry in the range. Exclusive with `account`.
          schema:
            $ref: '#/components/schemas/MoneyFigure'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /branches/{branchId}/ledger/summary:
    get:
      operationId: getLedgerSummary
      tags: [Reads]
      summary: Profit and loss by account, and the composition of each money figure.
      description: |
        Returns per-account totals through the Tick and, for each headline money
        figure, the accounts and signs that compose it, its `sumCents` computed
        from the Ledger entries (equal to the Metrics value) and the number of
        entries that add up to it. Use `listLedgerEntries` with `figure` to list
        those entries.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/TickQuery'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /branches/{branchId}/journal:
    get:
      operationId: listJournal
      tags: [Reads]
      summary: Read the outcome journal for a range of Ticks.
      description: |
        Returns the demand, shipment and order-cancellation outcomes of Ticks
        `from` through `to` inclusive, in engine order. The journal is derived
        output: it is rebuilt by replaying the Branch's Inputs, so it is never
        stored and never changes a State_Hash. A range spans at most 24 Ticks.
        `to` must not exceed the Head_Tick. A cancellation creates no Ledger
        entry. Results are paged with `limit` and `offset`.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - name: from
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Tick'
        - name: to
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Tick'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: The outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /branches/{branchId}/end-of-horizon:
    get:
      operationId: getEndOfHorizon
      tags: [Reads]
      summary: Read the End_Of_Horizon_Statement.
      description: |
        Reports positions as they stand at a Tick: open orders as backlog,
        open purchase-order commitments, remaining stock at cost, and the
        balance identity. Nothing is written down, liquidated or accrued.
        Without `tick` the statement is for the Head_Tick. `atHorizon` is true
        only when the Tick is the Scenario horizon.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - name: tick
          in: query
          required: false
          description: A Tick from 0 through the Head_Tick. Defaults to the Head_Tick.
          schema:
            $ref: '#/components/schemas/Tick'
      responses:
        '200':
          description: The statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndOfHorizonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /branches/{branchId}/decisions:
    get:
      operationId: listBranchDecisions
      tags: [Reads]
      summary: List the per-window decision records of an AI Branch.
      description: |
        Returns one record for every Decision_Window an AI manager handled on
        this Branch (not its ancestors), in window order. A window where the AI
        proposed no Command still has a record that names its provenance. Each
        record lists what was proposed, how many Commands the deterministic
        validator accepted, and the rejected proposals with reason codes;
        rejected proposals never reach the engine. Provenance `ai_rule_based`
        is the rule-based manager, `ai_llm` an accepted LLM proposal and
        `ai_rule_based_fallback` the rule-based manager standing in for the LLM,
        with `fallbackReason`. The rationale is untrusted text and must be shown
        escaped. Records are metadata: replay never reads them and no State_Hash
        covers them. A Human Branch returns an empty list.
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: The records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /branches/{branchId}/export:
    get:
      operationId: exportBranchInputs
      tags: [Reads]
      summary: Export the Inputs_File of a Branch.
      description: |
        Returns the Inputs of the Branch as a canonical Inputs_File, together
        with the Scenario hash, Seed and engine version. Inputs inherited from
        ancestor Branches are included up to each fork Tick; an ancestor's
        later Inputs are not. Seq is renumbered 1 to n in effective-Tick order,
        as replay does. Idempotency keys, timestamps and model names are not
        exported. Provenance and rationale are metadata and never change a
        State_Hash. The rationale is untrusted text. The body carries the
        stored `engineVersion`; when it differs from the running engine the
        response also sets the header `X-Parallel-Warnings: engine-version-mismatch`.
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: The Inputs_File.
          headers:
            X-Parallel-Warnings:
              description: Set to `engine-version-mismatch` when the World was recorded under another engine version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InputsFile'
        '404':
          $ref: '#/components/responses/NotFound'
  /branches/{branchId}/progress:
    get:
      operationId: streamBranchProgress
      tags: [Reads]
      summary: Stream Tick_Frames of a Branch as server-sent events.
      description: |
        A read-only presentation stream. It emits Tick_Frames that are already
        computed and never advances the simulation: the client still calls
        `POST /branches/{branchId}/advance` to compute Ticks, and the stream
        delivers each new frame as the Head_Tick moves. Playback speed is a
        client concern and never changes a State_Hash.

        Events, in order per Tick:

        - `tick` (`id` = Tick): data is a `ProgressTickEvent`, the same
          TickFrame object as `/tick-frames` including `metrics`, plus
          `warnings` when the World has engine warnings.
        - `decision_window` (`id` = Tick): sent after the `tick` event of a
          Tick whose frame holds a decision-window marker; data is a
          `ProgressDecisionWindowEvent`.
        - `completed` (`id` = horizon Tick): sent once after the horizon frame;
          data is a `ProgressCompletedEvent`. The server then ends the stream
          and the client should close it.

        A comment line `: heartbeat` is sent every 15 seconds without events.
        Reconnect with the `Last-Event-ID` header (the last Tick received):
        the first event is the next Tick, so `Last-Event-ID: 10` starts at
        Tick 11. Without the header, `fromTick` (default 0) is the first Tick
        streamed. The `Last-Event-ID` header wins when both are given. A
        client that reconnects with the horizon Tick receives `completed`
        again. A start Tick above the horizon plus one is a 422.

        At most 4 streams are open per client IP address; the fifth gets 429
        (`rate-limited`) with `Retry-After`, and the slot frees when a stream
        closes. This limit is separate from the request rate limit.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - name: fromTick
          in: query
          required: false
          description: First Tick to stream when `Last-Event-ID` is absent. Defaults to 0.
          schema:
            $ref: '#/components/schemas/Tick'
        - name: Last-Event-ID
          in: header
          required: false
          description: The last Tick the client received. The stream resumes at the next Tick.
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          description: An event stream. Each event is described by the Progress* schemas.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-cache]
            X-Accel-Buffering:
              schema:
                type: string
                enum: ['no']
          content:
            text/event-stream:
              schema:
                description: |
                  Server-sent events. This schema describes the JSON `data` of one
                  event; the `event` field says which: `tick`, `decision_window`
                  or `completed`.
                oneOf:
                  - $ref: '#/components/schemas/ProgressTickEvent'
                  - $ref: '#/components/schemas/ProgressDecisionWindowEvent'
                  - $ref: '#/components/schemas/ProgressCompletedEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /duels:
    post:
      operationId: createDuel
      tags: [Duels]
      summary: Create a World and a Duel on it.
      description: |
        Creates a new World (flagship scenario and demo seed 2026 unless given)
        and two sibling Branches forked from its root Branch at `forkTick`
        (default 0): the human Branch (label "You") and the AI Branch. Both
        see the same seed, Scenario, potential customer arrivals and
        Disruptions, and receive Decision_Windows at the same Ticks with the
        same Observation fields, Command budget and lead times. `aiKind` is
        `ai_rule_based` (default) or `ai_llm`. An LLM AI with no configured
        provider plays as the Rule-based AI and is labelled as such.
        Results are synthetic.
      parameters:
        - $ref: '#/components/parameters/LLMCode'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDuelRequest'
      responses:
        '403':
          $ref: '#/components/responses/LLMAccessCodeRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '201':
          description: The World, the Duel and its status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDuelResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /duels/{duelId}:
    get:
      operationId: getDuel
      tags: [Duels]
      summary: Read a Duel and its status.
      description: |
        The status says where both Branches are, the Comparison_Tick (the lower
        head Tick) and whom the Duel waits on: `human` while the human's
        Decision_Window at the head is open and not ended, otherwise `none`.
        The AI never holds the Duel.
      parameters:
        - $ref: '#/components/parameters/DuelId'
      responses:
        '200':
          description: The Duel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuelResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /duels/{duelId}/advance:
    post:
      operationId: advanceDuel
      tags: [Duels]
      summary: Advance both sides of a Duel in lockstep.
      description: |
        Without `runToTick` both Branches stop at the next Decision_Window or
        the horizon. With `runToTick` the human's intervening windows end with
        no Commands, the AI decides at each window it passes, and both stop at
        `runToTick`, the horizon or the next Disruption onset. While the human's
        window at the head is open, the request fails with `duel-window-open`.
        `expectedHeadTick` is checked against the human Branch head.
      parameters:
        - $ref: '#/components/parameters/DuelId'
        - $ref: '#/components/parameters/WriteToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceRequest'
      responses:
        '401':
          $ref: '#/components/responses/WriteTokenRequired'
        '403':
          $ref: '#/components/responses/WriteTokenInvalid'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Where both sides stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceDuelResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /duels/{duelId}/commands:
    post:
      operationId: submitDuelCommands
      tags: [Duels]
      summary: Submit the human manager's Commands.
      description: |
        Same rules as `submitCommands`, always on the human Branch of the Duel.
        There is no way to submit Commands for the AI side.
      parameters:
        - $ref: '#/components/parameters/DuelId'
        - $ref: '#/components/parameters/WriteToken'
        - name: Idempotency-Key
          in: header
          required: false
          description: Client-chosen key, 1 to 128 printable ASCII characters.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[\x21-\x7E]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCommandsRequest'
      responses:
        '401':
          $ref: '#/components/responses/WriteTokenRequired'
        '403':
          $ref: '#/components/responses/WriteTokenInvalid'
        '200':
          description: Accepted Inputs and rejected Commands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitCommandsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /duels/{duelId}/decision-window/end:
    post:
      operationId: endDuelWindow
      tags: [Duels]
      summary: End the human manager's Decision_Window.
      description: |
        Closes the human's window at the head so the Duel can advance. The AI
        Manager has already decided at that window.
      parameters:
        - $ref: '#/components/parameters/DuelId'
        - $ref: '#/components/parameters/WriteToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndWindowRequest'
      responses:
        '401':
          $ref: '#/components/responses/WriteTokenRequired'
        '403':
          $ref: '#/components/responses/WriteTokenInvalid'
        '204':
          description: The window is closed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /duels/{duelId}/disruptions:
    post:
      operationId: injectDuelDisruption
      tags: [Duels]
      summary: Inject one Disruption into both sides of a Duel.
      description: |
        Appends the same Disruption with the same start Tick to both Branches,
        so both realities face it identically. Ranges and errors follow
        `injectDisruption`.
      parameters:
        - $ref: '#/components/parameters/DuelId'
        - $ref: '#/components/parameters/WriteToken'
        - name: Idempotency-Key
          in: header
          required: false
          description: Client-chosen key, 1 to 128 printable ASCII characters.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[\x21-\x7E]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjectDisruptionRequest'
      responses:
        '401':
          $ref: '#/components/responses/WriteTokenRequired'
        '403':
          $ref: '#/components/responses/WriteTokenInvalid'
        '200':
          description: The recorded Input of each side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuelInjectResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /duels/{duelId}/score:
    get:
      operationId: getDuelScore
      tags: [Duels]
      summary: Read the Duel score at the Comparison_Tick.
      description: |
        Scores both sides at the lower of their head Ticks. `provisional` is
        true while either side is below the horizon: `outcome` is then the
        standing at that Tick, not a declared winner. The score is a 100-point
        composite held as integer hundredths (0 to 10000): financial,
        fulfilment and on-time components in basis points, each scaled by its
        weight. The financial component is normalized against the Scenario's
        profit floor and target, never against the opponent. Raw metrics are
        returned next to the score. A difference of at most
        `tieToleranceHundredths` is a draw.
        Results are synthetic and carry the disclaimer.
      parameters:
        - $ref: '#/components/parameters/DuelId'
      responses:
        '200':
          description: The score.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuelScore'
        '404':
          $ref: '#/components/responses/NotFound'
  /duels/{duelId}/decisions:
    get:
      operationId: listDuelDecisions
      tags: [Duels]
      summary: List the AI side's decision records.
      description: |
        One record per Decision_Window the AI handled, with provenance, model,
        fallback reason, accepted and rejected Commands with reason codes, and
        the rationale as untrusted text to be shown escaped. While the human's
        window at the Comparison_Tick is open, the AI's record for that window
        is withheld, so the human cannot read the opponent's move before
        committing their own. The human's own Commands are Inputs, read through
        the export of the human Branch.
      parameters:
        - $ref: '#/components/parameters/DuelId'
      responses:
        '200':
          description: The records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuelDecisionsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /diffs:
    post:
      operationId: createDiff
      tags: [Reads]
      summary: Compare two Branches of one World.
      description: |
        Read-only. Reports the observed differences of two Branches at one
        Comparison_Tick: the first Tick at which their State_Hashes differ, the
        State components that differ there, the Inputs present on one side only,
        the metrics and per-product stock of both sides, and `delta` = B minus A.
        `comparisonTick` defaults to the lower of the two head Ticks; a Tick above
        either head is `not-yet-simulated` (409). Branches of different Worlds, or
        of Worlds with another Scenario or engine version, are `incomparable-branches`
        (422). Branches that belong to a Duel can be compared. The `statement` says
        that observed differences do not establish cause; clients show it verbatim.
        Results are synthetic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiffRequest'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: The observed differences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  parameters:
    WorldId:
      name: worldId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DuelId:
      name: duelId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    WriteToken:
      name: X-Parallel-Write-Token
      in: header
      required: true
      description: |
        The world's write token, returned once as `writeToken` when the world
        (or demo, or duel) was created. Required on every request that changes
        a world. Reads never need it, so a link that holds only the id is
        read-only. Never put it in a URL.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    LLMCode:
      name: X-Parallel-LLM-Code
      in: header
      required: false
      description: |
        The server's LLM access code. Required only to start an LLM-backed
        manager (`ai_llm`) when the server sets `LLM_ACCESS_CODE` (see
        `requiresAccessCode` on `GET /managers`). The rule-based AI never
        needs it.
      schema:
        type: string
        maxLength: 512
    TickQuery:
      name: tick
      in: query
      required: true
      description: A Tick from 0 through the Head_Tick.
      schema:
        $ref: '#/components/schemas/Tick'
  responses:
    BadRequest:
      description: Malformed JSON, unknown field, missing or malformed parameter, invalid name or invalid scenario (types `bad-request`, `invalid-name`, `invalid-scenario`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The World or Branch does not exist (type `not-found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        The request conflicts with the Branch state. Types: `history-immutable`,
        `not-yet-simulated`, `stale-head`, `window-not-open`, `branch-limit`,
        `horizon-reached`, `duel-branch` (a direct mutation of a Branch that belongs to a Duel; use the duel endpoints), `duel-window-open`, `duel-diverged`, `decision-stale` (an AI answer arrived after the branch changed and was discarded; retry), `engine-version-mismatch` (a mutation of a World recorded
        under another engine version; its reads still work and carry a warning).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WriteTokenRequired:
      description: The request changes a world and has no `X-Parallel-Write-Token` header (type `write-token-required`). Reading the world needs no token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WriteTokenInvalid:
      description: |
        The write token does not match the world (type `write-token-invalid`),
        or the world predates write tokens and the server runs in production,
        where such a world is read-only. Repeated invalid tokens from one
        address give 429 `rate-limited`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LLMAccessCodeRequired:
      description: The server requires an LLM access code to start an LLM-backed manager and `X-Parallel-LLM-Code` is missing or wrong (type `llm-access-code-required`). Also possible on a fork that asks for an `ai_llm` manager.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The request body exceeds 256 KiB (type `payload-too-large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: The request is well-formed but invalid. Types `validation`, `invalid-tick`, `budget-exceeded`, `incomparable-branches` (two Branches of different Worlds, or of Worlds with another Scenario or engine version).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The per-IP rate limit was exceeded (type `rate-limited`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: |
        The store is unreachable, the server is busy (all simulation slots taken
        for the queue wait; `Retry-After` is set), the server holds its maximum
        number of worlds, or a request exceeded its deadline (type `unavailable`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Uuid:
      type: string
      format: uuid
      description: Random UUIDv4 identifier.
    Tick:
      type: integer
      format: int32
      minimum: 0
      description: Simulated hour. Tick 0 is the initial state.
    SimMinute:
      type: integer
      format: int64
      minimum: 0
      description: Minutes since scenario start. Tick N has minute 60 * N.
    Cents:
      type: integer
      format: int64
      description: Signed money in minor units (cents) of the response `currency`.
    Bps:
      type: integer
      format: int64
      description: Basis points. 10000 is 100 %.
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217 currency code of every `...Cents` field in the same response.
      examples: [USD]
    StateHash:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Lowercase hex SHA-256 of the canonical simulation state at a Tick. Excludes identifiers, labels, manager kind, timestamps and rationale.
    Disclaimer:
      type: string
      description: Fixed text. Results are synthetic.
      const: Synthetic simulation output under the stated assumptions. Not a forecast or guarantee of real-world results.
    ManagerKind:
      type: string
      enum: [human, ai_rule_based, ai_llm]
      description: Who manages the Branch. Recorded metadata. The engine never reads it.
    ManagerInfo:
      type: object
      required: [kind, name, description, available]
      properties:
        kind:
          $ref: '#/components/schemas/ManagerKind'
        name:
          type: string
        description:
          type: string
        available:
          type: boolean
        model:
          type: string
          description: The model identifier of the LLM AI. Present only when available. Never the API key or endpoint.
        unavailableReason:
          type: string
          description: Why the Manager kind is unavailable (for example not configured). Present only when unavailable.
        llmGlobalCallsRemaining:
          type: integer
          minimum: 0
          description: Provider calls left in today's (UTC) server-wide LLM limit (LLM_GLOBAL_MAX_CALLS). Present only on the available LLM AI.
        llmGlobalTokensRemaining:
          type: integer
          minimum: 0
          description: Tokens left in today's (UTC) server-wide LLM limit (LLM_GLOBAL_MAX_TOKENS), after in-flight reservations. Present only on the available LLM AI.
        requiresAccessCode:
          type: boolean
          description: True when starting this manager needs the `X-Parallel-LLM-Code` header (the server sets LLM_ACCESS_CODE). Present, and true, only on the available LLM AI.
    ManagerList:
      type: object
      required: [managers]
      properties:
        managers:
          type: array
          items:
            $ref: '#/components/schemas/ManagerInfo'
    Provenance:
      type: string
      enum: [human, ai_rule_based, ai_llm, ai_rule_based_fallback, scenario, injected]
      description: Where an Input came from. Recorded metadata excluded from every state hash.
    SupplierRole:
      type: string
      enum: [primary, backup]
    Account:
      type: string
      description: The fixed chart of accounts of the business.
      enum:
        - Cash
        - Inventory
        - Opening_Equity
        - Revenue
        - Cost_Of_Goods_Sold
        - Labor_Expense
        - Freight_Expense
        - Marketing_Expense
        - Overhead_Expense
        - Service_Credit_Expense
    DisruptionKind:
      type: string
      enum: [demand_surge, supplier_outage, workforce_absence]
    WindowReason:
      type: string
      enum: [cadence, disruption_onset, fork]
      description: Why a Decision_Window is open at a Tick.
    PauseReason:
      type: string
      enum: [decision_window, horizon, run_to_tick]
    ProbeStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    Health:
      type: object
      additionalProperties: false
      required: [status, engineVersion]
      properties:
        status:
          type: string
          enum: [ok]
        engineVersion:
          type: string
          description: Simulation engine version, for example `1`.
    ProblemType:
      type: string
      description: |
        URI that identifies the problem type. Status codes: history-immutable 409,
        not-yet-simulated 409, stale-head 409, window-not-open 409, branch-limit 409,
        horizon-reached 409, duel-branch 409, duel-window-open 409, duel-diverged 409, decision-stale 409, engine-version-mismatch 409, budget-exceeded 422, incomparable-branches 422, validation 422, invalid-tick 422,
        invalid-scenario 400, invalid-name 400, bad-request 400, forbidden 403, write-token-required 401,
        write-token-invalid 403, llm-access-code-required 403, not-found 404,
        payload-too-large 413, rate-limited 429, unavailable 503, internal 500.
        An unknown route gives not-found 404. A wrong method gives bad-request with status 405.
      enum:
        - urn:parallel:problem:history-immutable
        - urn:parallel:problem:not-yet-simulated
        - urn:parallel:problem:stale-head
        - urn:parallel:problem:window-not-open
        - urn:parallel:problem:budget-exceeded
        - urn:parallel:problem:incomparable-branches
        - urn:parallel:problem:validation
        - urn:parallel:problem:branch-limit
        - urn:parallel:problem:horizon-reached
        - urn:parallel:problem:engine-version-mismatch
        - urn:parallel:problem:duel-branch
        - urn:parallel:problem:duel-window-open
        - urn:parallel:problem:duel-diverged
        - urn:parallel:problem:decision-stale
        - urn:parallel:problem:invalid-tick
        - urn:parallel:problem:invalid-scenario
        - urn:parallel:problem:invalid-name
        - urn:parallel:problem:bad-request
        - urn:parallel:problem:not-found
        - urn:parallel:problem:forbidden
        - urn:parallel:problem:write-token-required
        - urn:parallel:problem:write-token-invalid
        - urn:parallel:problem:llm-access-code-required
        - urn:parallel:problem:payload-too-large
        - urn:parallel:problem:rate-limited
        - urn:parallel:problem:unavailable
        - urn:parallel:problem:internal
    Warning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable code, for example `engine-version-mismatch`.
        message:
          type: string
          description: Plain-language caveat naming the cause.
    Warnings:
      type: array
      description: |
        Present only when a caveat applies. `engine-version-mismatch` means the
        World was recorded under another engine version than the running one:
        results may not be reproducible or comparable, and advance, submit,
        fork and inject answer 409.
      items:
        $ref: '#/components/schemas/Warning'
    Problem:
      type: object
      description: RFC 9457 problem details. Never contains a stack trace.
      required: [type, title, status]
      properties:
        type:
          $ref: '#/components/schemas/ProblemType'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        issues:
          type: array
          description: Field-level issues for `invalid-scenario`, `invalid-name` and `validation`.
          items:
            $ref: '#/components/schemas/ProblemIssue'
        expectedHeadTick:
          $ref: '#/components/schemas/Tick'
        actualHeadTick:
          $ref: '#/components/schemas/Tick'
    CreateDiffRequest:
      type: object
      additionalProperties: false
      required: [branchA, branchB]
      properties:
        branchA:
          $ref: '#/components/schemas/Uuid'
        branchB:
          $ref: '#/components/schemas/Uuid'
        comparisonTick:
          $ref: '#/components/schemas/Tick'
    DiffComponent:
      type: object
      additionalProperties: false
      required: [name, skus]
      properties:
        name:
          type: string
          description: State component, for example `inventory`, `orders`, `ledger`, `workforce`, `prices`, `purchase_orders`, `disruptions`, `clock`, `streams`, `pending_events`.
        skus:
          type: array
          description: SKU indexes of the per-product entries that differ; empty when the component has none.
          items:
            type: integer
            format: int64
    DiffDivergence:
      type: object
      additionalProperties: false
      required: [tick, stateHashA, stateHashB, components]
      properties:
        tick:
          $ref: '#/components/schemas/Tick'
        stateHashA:
          $ref: '#/components/schemas/StateHash'
        stateHashB:
          $ref: '#/components/schemas/StateHash'
        components:
          type: array
          items:
            $ref: '#/components/schemas/DiffComponent'
        firstEventA:
          $ref: '#/components/schemas/JournalEntry'
        firstEventB:
          $ref: '#/components/schemas/JournalEntry'
    DiffDisruption:
      type: object
      additionalProperties: false
      required: [kind, target, durationTicks, magnitudeBps]
      properties:
        kind:
          $ref: '#/components/schemas/DisruptionKind'
        target:
          type: integer
          format: int64
          description: SKU index, or -1 for every SKU.
        role:
          $ref: '#/components/schemas/SupplierRole'
        durationTicks:
          type: integer
          format: int64
        magnitudeBps:
          $ref: '#/components/schemas/Bps'
    DiffInput:
      type: object
      description: An Input present on one side only. At most one of `command` and `disruption` is present, matching `kind`.
      additionalProperties: false
      required: [side, branchId, seq, effectiveTick, kind, provenance]
      properties:
        side:
          type: string
          enum: ['A', 'B']
        branchId:
          $ref: '#/components/schemas/Uuid'
        seq:
          type: integer
          format: int64
          minimum: 1
          description: Sequence number in the Branch's resolved Input list, as the export numbers it.
        effectiveTick:
          $ref: '#/components/schemas/Tick'
        kind:
          type: string
          enum: [command, disruption]
        command:
          $ref: '#/components/schemas/Command'
        disruption:
          $ref: '#/components/schemas/DiffDisruption'
        provenance:
          $ref: '#/components/schemas/Provenance'
    DiffMetric:
      type: object
      additionalProperties: false
      required: [key, a, b, delta]
      properties:
        key:
          type: string
          description: One of `net_profit`, `cash` (cents), `service_level`, `fill_rate` (basis points), `backlog_orders`, `backlog_units`, `late_backlog_orders`, `cancelled_orders` (counts).
        a:
          type: integer
          format: int64
        b:
          type: integer
          format: int64
        delta:
          type: integer
          format: int64
          description: B minus A.
    DiffSkuStock:
      type: object
      additionalProperties: false
      required: [sku, a, b, delta, valueCentsA, valueCentsB, valueCentsDelta]
      properties:
        sku:
          type: integer
          format: int64
        a:
          type: integer
          format: int64
          description: Units on hand in Branch A.
        b:
          type: integer
          format: int64
        delta:
          type: integer
          format: int64
        valueCentsA:
          $ref: '#/components/schemas/Cents'
        valueCentsB:
          $ref: '#/components/schemas/Cents'
        valueCentsDelta:
          $ref: '#/components/schemas/Cents'
    DiffResult:
      type: object
      additionalProperties: false
      required: [branchA, branchB, worldId, comparisonTick, divergence, differingInputs, metrics, skuStock, statement, disclaimer, currency]
      properties:
        branchA:
          $ref: '#/components/schemas/Uuid'
        branchB:
          $ref: '#/components/schemas/Uuid'
        worldId:
          $ref: '#/components/schemas/Uuid'
        comparisonTick:
          $ref: '#/components/schemas/Tick'
        divergence:
          description: Null when the State_Hashes are equal at every Tick up to `comparisonTick`.
          oneOf:
            - $ref: '#/components/schemas/DiffDivergence'
            - type: 'null'
        differingInputs:
          type: array
          items:
            $ref: '#/components/schemas/DiffInput'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/DiffMetric'
        skuStock:
          type: array
          items:
            $ref: '#/components/schemas/DiffSkuStock'
        statement:
          type: string
          description: Fixed text. Observed differences do not establish cause. Show it verbatim.
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
        currency:
          $ref: '#/components/schemas/Currency'
        warnings:
          $ref: '#/components/schemas/Warnings'
    ProblemIssue:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Assumption path such as `workforce.tempOnboardingTicks`, or a request field name.
        message:
          type: string
    CreateWorldRequest:
      type: object
      additionalProperties: false
      required: [name, seed]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        seed:
          $ref: '#/components/schemas/Seed'
        scenario:
          type: object
          description: A scenario document (schemaVersion 1). Omit it to use the flagship scenario. Validated against the documented Assumption bounds.
          additionalProperties: true
        overrides:
          type: object
          description: Assumption dotted path to new integer value, for example `workforce.regularWorkers`. Each value must lie within the Assumption's bounds.
          additionalProperties:
            type: integer
            format: int64
        managerKind:
          $ref: '#/components/schemas/ManagerKind'
    Name:
      type: string
      minLength: 1
      maxLength: 64
      description: 1 to 64 printable characters.
    Seed:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: World seed. The API limits it to 2^53 - 1 so JavaScript clients keep it exact.
    InputsFile:
      type: object
      description: |
        Canonical Inputs_File. Scenario hash, Seed and engine version identify
        the conditions under which the Inputs were recorded.
      additionalProperties: false
      required: [scenarioHash, seed, engineVersion, inputs]
      properties:
        scenarioHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hex SHA-256 of the canonical Scenario.
        seed:
          $ref: '#/components/schemas/Seed'
        engineVersion:
          type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/InputsFileInput'
    InputsFileInput:
      type: object
      description: One Input. Exactly one of `command` and `disruption` is present, matching `kind`.
      additionalProperties: false
      required: [effectiveTick, seq, kind, provenance]
      properties:
        effectiveTick:
          $ref: '#/components/schemas/Tick'
        seq:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [command, disruption]
        command:
          $ref: '#/components/schemas/InputsFileCommand'
        disruption:
          $ref: '#/components/schemas/InputsFileDisruption'
        provenance:
          $ref: '#/components/schemas/Provenance'
        rationale:
          type: string
          description: Optional untrusted display text. Omitted when empty.
    InputsFileCommand:
      type: object
      description: |
        A Command in its canonical fields. Only the fields named for the kind
        are read by the engine; the others are 0.
      additionalProperties: false
      required: [kind, sku, role, qty, amountCents, poRef]
      properties:
        kind:
          type: string
          enum: [set_price, place_purchase_order, expedite_purchase_order, schedule_overtime, hire_temp_workers, set_marketing_spend]
        sku:
          type: integer
          format: int64
          description: Index into the Scenario SKUs.
        role:
          type: integer
          minimum: 0
          maximum: 255
          description: Supplier role code, 0 primary and 1 backup.
        qty:
          type: integer
          format: int64
        amountCents:
          type: integer
          format: int64
        poRef:
          type: integer
          format: int64
          minimum: 0
    InputsFileDisruption:
      type: object
      description: An injected Disruption in its canonical fields.
      additionalProperties: false
      required: [kind, target, role, durationTicks, magnitudeBps]
      properties:
        kind:
          $ref: '#/components/schemas/DisruptionKind'
        target:
          type: integer
          format: int64
          description: SKU index, or -1 for every SKU.
        role:
          type: integer
          minimum: 0
          maximum: 255
          description: Supplier role code, 0 primary and 1 backup.
        durationTicks:
          type: integer
          format: int64
        magnitudeBps:
          type: integer
          format: int64
    CreateWorldResponse:
      type: object
      additionalProperties: false
      required: [world, rootBranch, writeToken]
      properties:
        writeToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: |
            Random 256-bit write token (base64url), shown only in this response.
            The server stores its SHA-256 hash only. Send it as
            `X-Parallel-Write-Token` on every request that changes the world.
            Anyone with only the world id can read but not change it.
        world:
          $ref: '#/components/schemas/World'
        rootBranch:
          $ref: '#/components/schemas/Branch'
    World:
      type: object
      additionalProperties: false
      required: [id, name, seed, engineVersion, scenarioHash, createdAt, currency, scenario, assumptions, llmAvailable, llmCallsMade, llmCallsRemaining, llmTokensUsed, llmTokensRemaining]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/Name'
        seed:
          $ref: '#/components/schemas/Seed'
        engineVersion:
          type: string
        llmAvailable:
          type: boolean
          description: |
            True when the server has an LLM configuration (base URL, key and
            model), so `ai_llm` Branches can ask the provider. When false the
            counters below are 0 and the Rule-based AI is offered instead.
        llmModel:
          type: string
          description: The configured model identifier. Present only when `llmAvailable`. The API key and endpoint are never returned.
        llmCallsMade:
          type: integer
          minimum: 0
          description: LLM requests this World has made, across all its Branches.
        llmCallsRemaining:
          type: integer
          minimum: 0
          description: Requests left before Decision_Windows fall back with reason `budget_exhausted`.
        llmTokensUsed:
          type: integer
          minimum: 0
          description: Prompt plus completion tokens the provider reported for this World.
        llmTokensRemaining:
          type: integer
          minimum: 0
          description: Tokens left before the per-World token cap is reached.
        scenarioHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the canonical scenario bytes.
        createdAt:
          type: string
          format: date-time
        currency:
          $ref: '#/components/schemas/Currency'
        scenario:
          $ref: '#/components/schemas/ScenarioSummary'
        assumptions:
          type: array
          description: Effective Assumptions in ascending path order.
          items:
            $ref: '#/components/schemas/Assumption'
        warnings:
          $ref: '#/components/schemas/Warnings'
    ScenarioSummary:
      type: object
      description: Public facts of the scenario. It never includes the Disruption_Script.
      additionalProperties: false
      required: [name, horizonTicks, startClock, decisionCadenceTicks, commandBudget, skus, scoreWeights]
      properties:
        name:
          type: string
        horizonTicks:
          type: integer
          minimum: 1
        startClock:
          type: string
          description: Wall-clock label of Tick 0, for example `Thu 00:00`.
        decisionCadenceTicks:
          type: integer
          minimum: 1
        commandBudget:
          type: integer
          minimum: 1
          description: Commands allowed per Decision_Window.
        skus:
          type: array
          items:
            $ref: '#/components/schemas/SkuSummary'
        scoreWeights:
          $ref: '#/components/schemas/ScoreWeights'
    SkuSummary:
      type: object
      additionalProperties: false
      required: [index, id, referencePriceCents, openingUnits, promiseTicks]
      properties:
        index:
          type: integer
          minimum: 0
          description: Index used by Commands.
        id:
          type: string
        referencePriceCents:
          $ref: '#/components/schemas/Cents'
        openingUnits:
          type: integer
          format: int64
        promiseTicks:
          type: integer
          description: Ticks from order creation to the ship-by promise.
    ScoreWeights:
      type: object
      additionalProperties: false
      required: [financialWeightBps, fulfilmentWeightBps, onTimeWeightBps]
      properties:
        financialWeightBps:
          $ref: '#/components/schemas/Bps'
        fulfilmentWeightBps:
          $ref: '#/components/schemas/Bps'
        onTimeWeightBps:
          $ref: '#/components/schemas/Bps'
    Assumption:
      type: object
      additionalProperties: false
      required: [path, value, unit, default, min, max, rationale, overridden]
      properties:
        path:
          type: string
          description: Dotted path of the Assumption in the scenario document.
        value:
          type: integer
          format: int64
          description: Effective value. Money in cents, rates in bps, durations in the stated unit.
        unit:
          type: string
        default:
          type: integer
          format: int64
        min:
          type: integer
          format: int64
        max:
          type: integer
          format: int64
        rationale:
          type: string
        overridden:
          type: boolean
          description: True when `value` differs from `default`.
    RevealedDisruption:
      type: object
      additionalProperties: false
      required: [kind, onsetTick, durationTicks]
      properties:
        kind:
          $ref: '#/components/schemas/DisruptionKind'
        onsetTick:
          $ref: '#/components/schemas/Tick'
        durationTicks:
          type: integer
          format: int64
        magnitudeBps:
          $ref: '#/components/schemas/Bps'
        target:
          type: string
          description: SKU id the entry targets, when it has one.
    AssumptionsResponse:
      type: object
      additionalProperties: false
      required: [worldId, branchId, headTick, horizonTicks, assumptions, scriptRevealed, scriptComplete, disclaimer]
      properties:
        worldId:
          $ref: '#/components/schemas/Uuid'
        branchId:
          $ref: '#/components/schemas/Uuid'
        headTick:
          $ref: '#/components/schemas/Tick'
          description: The Head_Tick that bounds the reveal (the lower duel head for a Duel Branch).
        horizonTicks:
          type: integer
          format: int64
        assumptions:
          type: array
          items:
            $ref: '#/components/schemas/Assumption'
        scriptRevealed:
          type: boolean
          description: True when `revealScript=true` was honoured and `disruptionScript` is present.
        scriptComplete:
          type: boolean
          description: True when the whole script is shown (the head reached the horizon).
        disruptionScript:
          type: array
          description: Only entries whose onset is at or before the head, or all of them at the horizon. Absent unless revealed.
          items:
            $ref: '#/components/schemas/RevealedDisruption'
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
    Branch:
      type: object
      additionalProperties: false
      required: [id, worldId, parentBranchId, forkTick, headTick, label, managerKind, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        worldId:
          $ref: '#/components/schemas/Uuid'
        parentBranchId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null for the root Branch.
        forkTick:
          $ref: '#/components/schemas/Tick'
        headTick:
          $ref: '#/components/schemas/Tick'
        label:
          $ref: '#/components/schemas/Name'
        managerKind:
          $ref: '#/components/schemas/ManagerKind'
        createdAt:
          type: string
          format: date-time
        warnings:
          $ref: '#/components/schemas/Warnings'
    BranchList:
      type: object
      additionalProperties: false
      required: [branches]
      properties:
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        warnings:
          $ref: '#/components/schemas/Warnings'
    ForkRequest:
      type: object
      additionalProperties: false
      required: [atTick, label]
      properties:
        atTick:
          $ref: '#/components/schemas/Tick'
        label:
          $ref: '#/components/schemas/Name'
        managerKind:
          $ref: '#/components/schemas/ManagerKind'
    AdvanceRequest:
      type: object
      additionalProperties: false
      properties:
        runToTick:
          $ref: '#/components/schemas/Tick'
        expectedHeadTick:
          $ref: '#/components/schemas/Tick'
    AdvanceResult:
      type: object
      additionalProperties: false
      required: [headTick, stateHash, paused, windowReasons, frames, currency, disclaimer]
      properties:
        headTick:
          $ref: '#/components/schemas/Tick'
        stateHash:
          $ref: '#/components/schemas/StateHash'
        paused:
          $ref: '#/components/schemas/PauseReason'
        windowReasons:
          type: array
          description: Why a Decision_Window is open at `headTick`. Empty when none is.
          items:
            $ref: '#/components/schemas/WindowReason'
        frames:
          type: array
          description: Tick_Frames of the Ticks computed by this request, ascending.
          items:
            $ref: '#/components/schemas/TickFrame'
        currency:
          $ref: '#/components/schemas/Currency'
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
    SubmitCommandsRequest:
      type: object
      additionalProperties: false
      required: [windowTick, commands]
      properties:
        windowTick:
          $ref: '#/components/schemas/Tick'
        commands:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/Command'
        expectedHeadTick:
          $ref: '#/components/schemas/Tick'
    InjectDisruptionRequest:
      type: object
      additionalProperties: false
      required: [kind, startTick, durationTicks]
      description: |
        Allowed ranges: `startTick` above the Head_Tick and at most the
        horizon; `durationTicks` 1 to the horizon; `target` -1 (all) or a SKU
        index. `demand_surge`: `magnitudeBps` 1 to 100000 and no `role`.
        `supplier_outage`: `role` required, `magnitudeBps` 0 or absent.
        `workforce_absence`: `magnitudeBps` 0 to 10000, target -1, no `role`.
      properties:
        kind:
          $ref: '#/components/schemas/DisruptionKind'
        startTick:
          $ref: '#/components/schemas/Tick'
        durationTicks:
          type: integer
          format: int32
          minimum: 1
        magnitudeBps:
          type: integer
          format: int64
        target:
          type: integer
          format: int64
          minimum: -1
          default: -1
        role:
          type: string
          enum: [primary, backup]
        expectedHeadTick:
          $ref: '#/components/schemas/Tick'
    InjectDisruptionResult:
      type: object
      additionalProperties: false
      required: [seq, effectiveTick, kind, durationTicks, magnitudeBps, target, provenance, duplicate]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
        effectiveTick:
          $ref: '#/components/schemas/Tick'
        kind:
          $ref: '#/components/schemas/DisruptionKind'
        durationTicks:
          type: integer
          format: int32
        magnitudeBps:
          type: integer
          format: int64
        target:
          type: integer
          format: int64
        role:
          type: string
          enum: [primary, backup]
        provenance:
          type: string
          enum: [injected]
        duplicate:
          type: boolean
    EndWindowRequest:
      type: object
      additionalProperties: false
      required: [windowTick]
      properties:
        windowTick:
          $ref: '#/components/schemas/Tick'
        expectedHeadTick:
          $ref: '#/components/schemas/Tick'
    CommandKind:
      type: string
      description: |
        The closed Command_Set. `set_price`, `place_purchase_order`,
        `expedite_purchase_order`, `schedule_overtime` and `hire_temp_workers`
        are implemented. The others are valid kinds that the validator rejects
        with code `not_implemented`.
      enum:
        - set_price
        - place_purchase_order
        - expedite_purchase_order
        - schedule_overtime
        - hire_temp_workers
        - set_marketing_spend
    Command:
      type: object
      additionalProperties: false
      required: [kind]
      description: |
        A manager decision. Only the fields named for the kind are read.
        `set_price`: sku, amountCents (new unit price within the scenario price bounds, by default 50 % to 200 % of the
        reference price, see `pricing.minPriceBps` and `pricing.maxPriceBps`; the bounds per product are in the observation as `priceBounds`). `place_purchase_order`: sku, role, qty (1 to 1000000).
        `expedite_purchase_order`: poRef (an open purchase order, expedited at most once, not during a supplier outage; the fee is affordable). `schedule_overtime`: qty (overtime hours per regular worker per tick, from the next tick until changed; 0 cancels; at most the scenario maximum, else `overtime_exceeds_limit`).
        `hire_temp_workers`: qty (workers, at least 1; total contracted at most the scenario maximum, else `too_many_temp_workers`; paid from the effective tick including onboarding, capacity only after onboarding; first-tick wages must be affordable). `set_marketing_spend`: sku, amountCents (spend per hour from the effective tick until changed; 0 stops it; at most `demand.maxMarketingSpendCentsPerHour`, else `marketing_exceeds_limit`; the first hour's spend must be affordable; it is posted as Marketing_Expense every tick and raises conversion of the same potential arrivals).
      properties:
        kind:
          $ref: '#/components/schemas/CommandKind'
        sku:
          type: integer
          format: int64
          minimum: 0
          description: Index into the scenario SKU list.
        role:
          $ref: '#/components/schemas/SupplierRole'
        qty:
          type: integer
          format: int64
        amountCents:
          $ref: '#/components/schemas/Cents'
        poRef:
          type: integer
          format: int64
          minimum: 0
          description: Purchase order identifier.
    RejectCode:
      type: string
      description: Machine-readable reason a Command was rejected.
      enum:
        - unknown_command
        - not_implemented
        - budget_exhausted
        - unknown_sku
        - price_out_of_bounds
        - invalid_quantity
        - unknown_supplier
        - supplier_unavailable
        - insufficient_cash
        - unknown_purchase_order
        - already_expedited
        - overtime_exceeds_limit
        - too_many_temp_workers
        - marketing_exceeds_limit
    ValidationResult:
      type: object
      additionalProperties: false
      required: [index, command, ok]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position of the Command in the request.
        command:
          $ref: '#/components/schemas/Command'
        ok:
          type: boolean
        code:
          $ref: '#/components/schemas/RejectCode'
        message:
          type: string
          description: Present when `ok` is false.
    AcceptedCommand:
      type: object
      additionalProperties: false
      required: [seq, effectiveTick, command, provenance]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: Per-Branch input sequence number.
        effectiveTick:
          $ref: '#/components/schemas/Tick'
        command:
          $ref: '#/components/schemas/Command'
        provenance:
          $ref: '#/components/schemas/Provenance'
    SubmitCommandsResult:
      type: object
      additionalProperties: false
      required: [accepted, rejected, budgetRemaining, duplicate]
      properties:
        accepted:
          type: array
          items:
            $ref: '#/components/schemas/AcceptedCommand'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
        budgetRemaining:
          type: integer
          minimum: 0
          description: Commands still allowed in this window.
        duplicate:
          type: boolean
          description: True when the Idempotency-Key repeated an earlier submission. Nothing was appended.
    DecisionRecord:
      type: object
      additionalProperties: false
      required: [windowTick, managerKind, provenance, rationale, proposed, acceptedCount, rejected, createdAt]
      properties:
        windowTick:
          $ref: '#/components/schemas/Tick'
        managerKind:
          $ref: '#/components/schemas/ManagerKind'
        provenance:
          $ref: '#/components/schemas/Provenance'
        model:
          type: string
          description: Model name of an LLM proposal. Omitted otherwise.
        fallbackReason:
          type: string
          description: Why the rule-based manager stood in, with provenance `ai_rule_based_fallback`. Omitted otherwise.
        rationale:
          type: string
          description: Untrusted display text. Empty when the manager gave none.
        proposed:
          type: array
          description: The Commands the manager proposed, in priority order.
          items:
            $ref: '#/components/schemas/Command'
        acceptedCount:
          type: integer
          minimum: 0
          description: How many proposals the validator accepted and stored as Inputs.
        rejected:
          type: array
          description: Proposals the validator refused. They were stored nowhere.
          items:
            $ref: '#/components/schemas/ValidationResult'
        createdAt:
          type: string
          format: date-time
          description: Server wall-clock time. Metadata, excluded from every State_Hash.
    DecisionsResponse:
      type: object
      additionalProperties: false
      required: [branchId, decisions]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/DecisionRecord'
    TickFramesResponse:
      type: object
      additionalProperties: false
      required: [branchId, frames, currency, disclaimer]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        frames:
          type: array
          items:
            $ref: '#/components/schemas/TickFrame'
        currency:
          $ref: '#/components/schemas/Currency'
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
        warnings:
          $ref: '#/components/schemas/Warnings'
    TickFrame:
      type: object
      description: |
        Read model of one Tick_Boundary, derived only from the state, the scenario
        and the tick's Fulfilment_Constraint_Report.
      additionalProperties: false
      required: [tick, stateHash, skus, workersOnShift, tempsOnShift, tempsOnboarding, orderQueueLen, disruptions, report, markers, metrics]
      properties:
        tick:
          $ref: '#/components/schemas/Tick'
        stateHash:
          $ref: '#/components/schemas/StateHash'
        skus:
          type: array
          items:
            $ref: '#/components/schemas/SkuFrame'
        workersOnShift:
          type: integer
          format: int64
          description: Regular workers on shift after absences.
        tempsOnShift:
          type: integer
          format: int64
          description: Temporary workers past onboarding.
        tempsOnboarding:
          type: integer
          format: int64
          description: Temporary workers hired but not yet ready.
        orderQueueLen:
          type: integer
          format: int64
          description: Open customer orders.
        disruptions:
          type: array
          description: Disruptions in effect at this Tick.
          items:
            $ref: '#/components/schemas/DisruptionFrame'
        report:
          $ref: '#/components/schemas/FulfilmentConstraintReport'
        markers:
          type: array
          items:
            $ref: '#/components/schemas/FrameMarker'
        metrics:
          $ref: '#/components/schemas/Metrics'
    SkuFrame:
      type: object
      additionalProperties: false
      required: [sku, onHand, inboundPOs, inboundUnits]
      properties:
        sku:
          type: integer
          format: int64
        onHand:
          type: integer
          format: int64
        inboundPOs:
          type: integer
          format: int64
          description: Open purchase orders for the SKU.
        inboundUnits:
          type: integer
          format: int64
          description: Units on those purchase orders.
    DisruptionFrame:
      type: object
      additionalProperties: false
      required: [kind, origin, inputSeq, target, magnitudeBps, onsetTick, endTick, ticksSinceOnset]
      properties:
        kind:
          $ref: '#/components/schemas/DisruptionKind'
        origin:
          $ref: '#/components/schemas/DisruptionOrigin'
        inputSeq:
          type: integer
          format: int64
          minimum: 0
        target:
          type: integer
          format: int64
          description: SKU index, or -1 when the Disruption has no SKU target.
        magnitudeBps:
          $ref: '#/components/schemas/Bps'
        onsetTick:
          $ref: '#/components/schemas/Tick'
        endTick:
          $ref: '#/components/schemas/Tick'
        ticksSinceOnset:
          type: integer
          minimum: 0
          description: 0 in the onset Tick.
    DisruptionOrigin:
      type: string
      enum: [script, injected]
    FulfilmentConstraintReport:
      type: object
      description: Per-Tick record of open orders that did not ship, split into stock-bound and capacity-bound.
      additionalProperties: false
      required: [tick, capacity, capacityUsed, shippedOrders, skus]
      properties:
        tick:
          $ref: '#/components/schemas/Tick'
        capacity:
          type: integer
          format: int64
          description: Units of fulfilment capacity available this Tick.
        capacityUsed:
          type: integer
          format: int64
          description: Units shipped this Tick.
        shippedOrders:
          type: integer
          format: int64
        skus:
          type: array
          description: Only SKUs with at least one unshipped order, ascending by SKU index.
          items:
            $ref: '#/components/schemas/SkuConstraint'
    SkuConstraint:
      type: object
      additionalProperties: false
      required: [sku, stockBoundOrders, stockBoundUnits, capacityBoundOrders, capacityBoundUnits]
      properties:
        sku:
          type: integer
          format: int64
        stockBoundOrders:
          type: integer
          format: int64
          description: Orders left open because on-hand stock was short.
        stockBoundUnits:
          type: integer
          format: int64
        capacityBoundOrders:
          type: integer
          format: int64
          description: Orders left open because capacity ran out.
        capacityBoundUnits:
          type: integer
          format: int64
    FrameMarker:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [decision_window, disruption_onset]
        windowReason:
          $ref: '#/components/schemas/WindowReason'
        disruptionKind:
          $ref: '#/components/schemas/DisruptionKind'
    Metrics:
      type: object
      description: |
        Output of the one Metrics_Calculator at a Tick. Every figure is an
        integer. Sums run over Ledger entries from Tick 0 through `tick` unless
        a field says otherwise. Money is in cents of the response `currency`.
      additionalProperties: false
      required:
        - tick
        - netRevenueCents
        - costOfGoodsSoldCents
        - freightExpenseCents
        - variableCostCents
        - contributionCents
        - laborExpenseCents
        - marketingExpenseCents
        - overheadExpenseCents
        - serviceCreditExpenseCents
        - netProfitCents
        - netCashFlowCents
        - cashCents
        - inventoryValueCents
        - ordersDue
        - ordersDueOnTime
        - unitsDue
        - unitsDueShipped
        - serviceLevelBps
        - fillRateBps
        - backlogOrders
        - backlogUnits
        - lateBacklogOrders
        - lateBacklogUnits
        - reconciliation
      properties:
        tick:
          $ref: '#/components/schemas/Tick'
        netRevenueCents:
          type: integer
          format: int64
          description: |
            Formula: Revenue account balance. Account: Revenue. The sum of Revenue
            credits, recognised at shipment and never reduced.
        costOfGoodsSoldCents:
          type: integer
          format: int64
          description: 'Formula: Cost_Of_Goods_Sold account balance. Account: Cost_Of_Goods_Sold. Moving weighted average cost of shipped units.'
        freightExpenseCents:
          type: integer
          format: int64
          description: 'Formula: Freight_Expense account balance. Account: Freight_Expense (outbound shipping and expedite fees).'
        variableCostCents:
          type: integer
          format: int64
          description: 'Formula: costOfGoodsSoldCents + freightExpenseCents. Accounts: Cost_Of_Goods_Sold, Freight_Expense.'
        contributionCents:
          type: integer
          format: int64
          description: 'Formula: netRevenueCents - variableCostCents. Accounts: Revenue, Cost_Of_Goods_Sold, Freight_Expense.'
        laborExpenseCents:
          type: integer
          format: int64
          description: 'Formula: Labor_Expense account balance. Account: Labor_Expense (regular, overtime and temporary wages, paid in the tick earned).'
        marketingExpenseCents:
          type: integer
          format: int64
          description: 'Formula: Marketing_Expense account balance. Account: Marketing_Expense.'
        overheadExpenseCents:
          type: integer
          format: int64
          description: 'Formula: Overhead_Expense account balance. Account: Overhead_Expense.'
        serviceCreditExpenseCents:
          type: integer
          format: int64
          description: 'Formula: Service_Credit_Expense account balance. Account: Service_Credit_Expense (credit for each order shipped late).'
        netProfitCents:
          type: integer
          format: int64
          description: |
            Formula: contributionCents - (laborExpenseCents + marketingExpenseCents +
            overheadExpenseCents + serviceCreditExpenseCents). Accounts: Revenue minus
            all expense accounts.
        netCashFlowCents:
          type: integer
          format: int64
          description: 'Formula: sum of Cash debits minus Cash credits over every entry from Tick 0 through `tick`, excluding the opening entry. Account: Cash.'
        cashCents:
          type: integer
          format: int64
          description: 'Formula: Cash account balance, which is opening cash plus every Cash line. Account: Cash.'
        inventoryValueCents:
          type: integer
          format: int64
          description: 'Formula: Inventory account balance, which equals the sum of per-SKU moving-average inventory values. Account: Inventory.'
        ordersDue:
          type: integer
          format: int64
          description: Orders (open, shipped or cancelled) whose ship-by minute is at most 60 * tick.
        ordersDueOnTime:
          type: integer
          format: int64
          description: Orders due that shipped at or before their ship-by minute.
        unitsDue:
          type: integer
          format: int64
          description: Units in orders due.
        unitsDueShipped:
          type: integer
          format: int64
          description: Units in orders due that have shipped.
        serviceLevelBps:
          $ref: '#/components/schemas/Bps'
          description: 'Formula: round half to even of ordersDueOnTime * 10000 / ordersDue. 10000 when ordersDue is 0. Derived from the order book, no Ledger account.'
        fillRateBps:
          $ref: '#/components/schemas/Bps'
          description: 'Formula: round half to even of unitsDueShipped * 10000 / unitsDue. 10000 when unitsDue is 0. Derived from the order book, no Ledger account.'
        backlogOrders:
          type: integer
          format: int64
          description: Orders that are neither shipped nor cancelled.
        backlogUnits:
          type: integer
          format: int64
          description: Units in the backlog orders.
        lateBacklogOrders:
          type: integer
          format: int64
          description: Backlog orders whose ship-by minute is before 60 * tick.
        lateBacklogUnits:
          type: integer
          format: int64
          description: Units in the late backlog orders.
        reconciliation:
          $ref: '#/components/schemas/Reconciliation'
    Reconciliation:
      type: object
      description: Identities that tie profit, cash and inventory together.
      additionalProperties: false
      required:
        - openingInventoryCents
        - inventoryChangeCents
        - profitLessCashFlowCents
        - accrualToCashHolds
        - openingEquityCents
        - balanceIdentityHolds
      properties:
        openingInventoryCents:
          type: integer
          format: int64
          description: 'Inventory debit of the opening entry. Account: Inventory.'
        inventoryChangeCents:
          type: integer
          format: int64
          description: 'Formula: inventoryValueCents - openingInventoryCents. Account: Inventory.'
        profitLessCashFlowCents:
          type: integer
          format: int64
          description: 'Formula: netProfitCents - netCashFlowCents. Equals inventoryChangeCents.'
        accrualToCashHolds:
          type: boolean
          description: True when profitLessCashFlowCents equals inventoryChangeCents.
        openingEquityCents:
          type: integer
          format: int64
          description: 'Opening_Equity account balance. Account: Opening_Equity.'
        balanceIdentityHolds:
          type: boolean
          description: True when cashCents + inventoryValueCents equals openingEquityCents + netProfitCents.
    MetricsResponse:
      type: object
      additionalProperties: false
      required: [branchId, tick, stateHash, metrics, currency, disclaimer]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        tick:
          $ref: '#/components/schemas/Tick'
        stateHash:
          $ref: '#/components/schemas/StateHash'
        metrics:
          $ref: '#/components/schemas/Metrics'
        currency:
          $ref: '#/components/schemas/Currency'
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
        warnings:
          $ref: '#/components/schemas/Warnings'
    BranchState:
      type: object
      additionalProperties: false
      required: [branchId, tick, stateHash, observation, currency, disclaimer]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        tick:
          $ref: '#/components/schemas/Tick'
        stateHash:
          $ref: '#/components/schemas/StateHash'
        observation:
          $ref: '#/components/schemas/Observation'
        currency:
          $ref: '#/components/schemas/Currency'
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
        warnings:
          $ref: '#/components/schemas/Warnings'
    Observation:
      type: object
      description: |
        Everything a Manager may know at a Tick_Boundary. It never contains the
        seed, random stream state, future draws, or Disruptions whose onset Tick
        is after `tick`.
      additionalProperties: false
      required: [tick, cashCents, skus, openOrders, purchaseOrders, workforce, disruptions, metrics, window]
      properties:
        tick:
          $ref: '#/components/schemas/Tick'
        cashCents:
          $ref: '#/components/schemas/Cents'
        skus:
          type: array
          description: Ordered by SKU identifier string.
          items:
            $ref: '#/components/schemas/ObsSku'
        openOrders:
          type: array
          description: Ordered by ship-by minute, then order sequence.
          items:
            $ref: '#/components/schemas/ObsOrder'
        purchaseOrders:
          type: array
          description: Open purchase orders ordered by identifier.
          items:
            $ref: '#/components/schemas/ObsPurchaseOrder'
        workforce:
          $ref: '#/components/schemas/ObsWorkforce'
        disruptions:
          type: array
          description: Disruptions in effect, ordered by onset Tick, then origin, then input sequence.
          items:
            $ref: '#/components/schemas/ObsDisruption'
        metrics:
          $ref: '#/components/schemas/Metrics'
        window:
          $ref: '#/components/schemas/ObsWindow'
    ObsSku:
      type: object
      additionalProperties: false
      required: [sku, id, onHand, inventoryValueCents, referencePriceCents, priceBounds, priceCents, marketingCents, inboundPOs, inboundUnits, suppliers]
      properties:
        sku:
          type: integer
          format: int64
          description: Index used by Commands.
        id:
          type: string
        onHand:
          type: integer
          format: int64
        inventoryValueCents:
          $ref: '#/components/schemas/Cents'
        referencePriceCents:
          $ref: '#/components/schemas/Cents'
        priceBounds:
          type: object
          additionalProperties: false
          required: [minCents, maxCents]
          description: Allowed `set_price` range for this product, from the scenario's pricing assumptions.
          properties:
            minCents:
              $ref: '#/components/schemas/Cents'
            maxCents:
              $ref: '#/components/schemas/Cents'
        priceCents:
          $ref: '#/components/schemas/Cents'
          description: Current selling price.
        marketingCents:
          $ref: '#/components/schemas/Cents'
          description: Current hourly marketing spend.
        inboundPOs:
          type: integer
          format: int64
        inboundUnits:
          type: integer
          format: int64
        suppliers:
          type: array
          items:
            $ref: '#/components/schemas/ObsSupplier'
    ObsSupplier:
      type: object
      additionalProperties: false
      required: [role, unitCostCents, leadTimeTicks, available, availableFromTick]
      properties:
        role:
          $ref: '#/components/schemas/SupplierRole'
        unitCostCents:
          $ref: '#/components/schemas/Cents'
        leadTimeTicks:
          type: integer
          format: int64
        available:
          type: boolean
          description: False while a supplier_outage covers this supplier.
        availableFromTick:
          $ref: '#/components/schemas/Tick'
          description: Tick at whose boundary the outage has ended. 0 when `available`.
    ObsOrder:
      type: object
      additionalProperties: false
      required: [id, sku, qty, promisedBy]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        sku:
          type: integer
          format: int64
        qty:
          type: integer
          format: int64
        promisedBy:
          $ref: '#/components/schemas/SimMinute'
    ObsPurchaseOrder:
      type: object
      additionalProperties: false
      required: [id, sku, supplier, qty, unitCostCents, dueAt, expedited]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        sku:
          type: integer
          format: int64
        supplier:
          $ref: '#/components/schemas/SupplierRole'
        qty:
          type: integer
          format: int64
        unitCostCents:
          $ref: '#/components/schemas/Cents'
        dueAt:
          $ref: '#/components/schemas/SimMinute'
        expedited:
          type: boolean
    ObsWorkforce:
      type: object
      additionalProperties: false
      required: [regular, overtimeHours, workersOnShift, tempsOnShift, tempsOnboarding]
      properties:
        regular:
          type: integer
          format: int64
        overtimeHours:
          type: integer
          format: int64
        workersOnShift:
          type: integer
          format: int64
        tempsOnShift:
          type: integer
          format: int64
        tempsOnboarding:
          type: integer
          format: int64
    ObsDisruption:
      type: object
      additionalProperties: false
      required: [kind, origin, inputSeq, target, magnitudeBps, onsetTick, endTick]
      properties:
        kind:
          $ref: '#/components/schemas/DisruptionKind'
        origin:
          $ref: '#/components/schemas/DisruptionOrigin'
        inputSeq:
          type: integer
          format: int64
          minimum: 0
        target:
          type: integer
          format: int64
          description: SKU index, or -1 when there is no SKU target.
        supplierRole:
          $ref: '#/components/schemas/SupplierRole'
          description: Present for `supplier_outage`.
        magnitudeBps:
          $ref: '#/components/schemas/Bps'
          description: Not meaningful for `supplier_outage`, which reports `supplierRole` instead.
        onsetTick:
          $ref: '#/components/schemas/Tick'
        endTick:
          $ref: '#/components/schemas/Tick'
    ObsWindow:
      type: object
      additionalProperties: false
      required: [open, reasons, cadenceTicks, commandBudget, horizonTicks, ticksRemaining]
      properties:
        open:
          type: boolean
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/WindowReason'
        cadenceTicks:
          type: integer
        commandBudget:
          type: integer
        horizonTicks:
          type: integer
        ticksRemaining:
          type: integer
    LedgerResponse:
      type: object
      additionalProperties: false
      required: [branchId, from, to, total, offset, entries, currency, disclaimer]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        from:
          $ref: '#/components/schemas/Tick'
        to:
          $ref: '#/components/schemas/Tick'
        total:
          type: integer
          minimum: 0
          description: Number of entries matching the range and filter.
        offset:
          type: integer
          minimum: 0
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        figure:
          $ref: '#/components/schemas/MoneyFigure'
        sumCents:
          type: integer
          format: int64
          description: Present with `figure`. Sum of the contributions of every matching entry, not only this page.
        currency:
          $ref: '#/components/schemas/Currency'
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
        warnings:
          $ref: '#/components/schemas/Warnings'
    MoneyFigure:
      type: string
      enum: [cash, net_profit, net_revenue, cost_of_goods_sold, freight, labor, marketing, overhead, service_credits]
    LedgerSummaryResponse:
      type: object
      additionalProperties: false
      required: [branchId, tick, accounts, figures, currency, disclaimer]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        tick:
          $ref: '#/components/schemas/Tick'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/LedgerAccountTotal'
        figures:
          type: array
          items:
            $ref: '#/components/schemas/LedgerFigure'
        currency:
          $ref: '#/components/schemas/Currency'
        disclaimer:
          $ref: '#/components/schemas/Disclaimer'
        warnings:
          $ref: '#/components/schemas/Warnings'
    LedgerAccountTotal:
      type: object
      additionalProperties: false
      required: [account, normalSide, debitCents, creditCents, balanceCents, entryCount]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        normalSide:
          type: string
